[project]
name = "vm-analysis-tool"
version = "0.2.0"
description = "Vulnerability intelligence aggregation with FastAPI"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "jinja2>=3.1,<4",
    "pydantic>=2.7,<3",
    "python-dotenv>=1,<2",
    "uvicorn>=0.30,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

